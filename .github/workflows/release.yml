name: Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Decide se rilasciare e con quale tag.
  # - push di un tag v*      → rilascia con quel tag.
  # - push su main / manuale → legge la versione da website/package.json e
  #                            rilascia solo se il tag corrispondente non esiste
  #                            già (cioè quando hai bumpato la versione).
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determina tag e se rilasciare
        id: decide
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(jq -r .version website/package.json)
            TAG="v$VERSION"
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
              echo "Tag $TAG già esistente: nessun rilascio."
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "Nuova versione $TAG: rilascio."
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # macOS: app Swift nativa.
  macos:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Compila e assembla il bundle (senza installare)
        run: GITHUB_REF_NAME="${{ needs.check.outputs.tag }}" INSTALL=0 ./build.sh

      - name: Crea il DMG
        run: |
          VERSION="${TAG#v}"
          hdiutil create -volname Klipski \
            -srcfolder Klipski.app \
            -ov -format UDZO "Klipski_${VERSION}.dmg"
        env:
          TAG: ${{ needs.check.outputs.tag }}

      - name: Carica nella release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          draft: false
          files: Klipski_*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Windows: client WPF (.NET 8), exe framework-dependent compresso in uno zip.
  # Parte dopo il job macOS così la release (creata da quello) esiste già.
  windows:
    needs: [check, macos]
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test della logica
        run: dotnet run -c Release --project windows/Tests/Tests.csproj

      - name: Compila l'exe e crea lo zip
        shell: pwsh
        run: |
          $version = "$env:TAG".TrimStart("v")
          dotnet publish windows/Klipski.csproj -c Release -o publish -p:Version=$version
          Compress-Archive -Path publish/Klipski.exe -DestinationPath "Klipski_${version}_windows_x64.zip"
        env:
          TAG: ${{ needs.check.outputs.tag }}

      - name: Carica nella release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          draft: false
          files: Klipski_*_windows_x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
